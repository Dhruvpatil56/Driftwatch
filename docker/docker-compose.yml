# DriftWatch — full stack. Run from the docker/ directory:
#   cp ../.env.example ../.env && docker compose up
#
# Config: every service loads the root .env via `env_file: ../.env`, which
# injects the variables into the container. We deliberately avoid `${VAR}`
# interpolation in this file — that is resolved from a .env in the directory
# you invoke compose from, not from env_file, and would silently be blank.
# Values that must be read at runtime (e.g. the healthcheck) use `$$VAR` so the
# container shell expands them from the injected environment.
#
# Paths are relative to this file (docker/). Build context is the repo root.

services:
  postgres:
    image: postgres:16
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Open Policy Agent — evaluates policies/rules.rego for the scorer.
  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies/rules.rego"
    ports:
      - "8181:8181"
    volumes:
      - ../policies:/policies:ro

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      redis:
        condition: service_started

  scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    command: sh -c "python scripts/wait_for_db.py && python -m scraper.scheduler"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    env_file: ../.env
    ports:
      - "3000:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    env_file: ../.env
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file: ../.env
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  grafana-data:
